# Disposable Linux ACPI control for the WinAVF ARM64 platform.
# `acpi=force` makes Linux select ACPI before any FDT fallback.  A runtime PASS
# requires both Linux serial progress and ACPI table-consumption evidence.
set timeout=0
set default=0
terminal_output console

menuentry 'WinAVF Linux ACPI control' {
    linux /debian-installer/arm64/linux acpi=force console=ttyS0,115200n8 earlycon=uart8250,mmio32,0x3f8 ignore_loglevel loglevel=7 ---
    initrd /debian-installer/arm64/initrd.gz
}
